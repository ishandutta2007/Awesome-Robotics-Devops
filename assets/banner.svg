<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="340" style="background: #080c16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 12px; overflow: hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0c1224"/>
      <stop offset="100%" stop-color="#14112e"/>
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08"/>
      <circle cx="40" cy="40" r="1" fill="#818cf8" fill-opacity="0.2"/>
    </pattern>

    <!-- Dynamic Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(7px) rotate(-1deg); }
      }
      @keyframes telemetryWave {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes ping {
        0% { r: 3; opacity: 1; }
        100% { r: 16; opacity: 0; }
      }
      @keyframes beamFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }

      .pulse-node {
        animation: pulseGlow 3.5s infinite ease-in-out;
      }
      .float-1 {
        animation: floatSlow1 5s infinite ease-in-out;
      }
      .float-2 {
        animation: floatSlow2 6s infinite ease-in-out;
      }
      .telemetry-line {
        stroke-dasharray: 600;
        animation: telemetryWave 6s linear infinite;
      }
      .wave-beam {
        stroke-dasharray: 20, 20;
        animation: beamFlow 4s linear infinite;
      }
      .ping-ring {
        animation: ping 2.5s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- 1. Background Fill & Grid -->
  <rect width="1000" height="340" fill="url(#bgGrad)"/>
  <rect width="1000" height="340" fill="url(#grid)"/>

  <!-- 2. Ambient Glow Spheres (Background) -->
  <circle cx="200" cy="90" r="140" fill="#0284c7" opacity="0.12" filter="url(#glow)" class="pulse-node"/>
  <circle cx="820" cy="180" r="160" fill="#7c3aed" opacity="0.12" filter="url(#glow)" class="pulse-node" style="animation-delay: 1.5s;"/>

  <!-- 3. Dynamic Robotics Constellation & Fleet Network (Background / Midground) -->
  <g stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.2" fill="none">
    <path d="M 60 70 L 160 110 L 250 50 L 370 80" class="wave-beam"/>
    <path d="M 640 60 L 760 90 L 890 60 L 940 120" class="wave-beam"/>
    <path d="M 120 270 L 220 240 L 320 280" stroke-opacity="0.2"/>
    <path d="M 680 280 L 790 250 L 890 290" stroke-opacity="0.2"/>
  </g>

  <!-- Fleet Network Nodes -->
  <g fill="#38bdf8">
    <circle cx="160" cy="110" r="3.5" filter="url(#softGlow)"/>
    <circle cx="160" cy="110" r="8" fill="none" stroke="#38bdf8" stroke-width="1" class="ping-ring"/>
    <circle cx="250" cy="50" r="3"/>
    <circle cx="760" cy="90" r="3.5" fill="#a78bfa" filter="url(#softGlow)"/>
    <circle cx="760" cy="90" r="8" fill="none" stroke="#a78bfa" stroke-width="1" class="ping-ring" style="animation-delay: 1s;"/>
    <circle cx="890" cy="60" r="3" fill="#a78bfa"/>
  </g>

  <!-- Dynamic Floating Tech Badges (Sides, unobstructing title) -->
  <g class="float-1" transform="translate(45, 140)">
    <rect width="115" height="30" rx="15" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="15" cy="15" r="4" fill="#38bdf8"/>
    <text x="27" y="19" fill="#93c5fd" font-size="11" font-weight="600" letter-spacing="0.5">ROS 2 Fleet</text>
  </g>

  <g class="float-2" transform="translate(60, 205)">
    <rect width="130" height="30" rx="15" fill="url(#pillGrad1)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="15" cy="15" r="4" fill="#818cf8"/>
    <text x="27" y="19" fill="#c7d2fe" font-size="11" font-weight="600" letter-spacing="0.5">Observability</text>
  </g>

  <g class="float-2" transform="translate(835, 130)">
    <rect width="125" height="30" rx="15" fill="url(#pillGrad1)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="15" cy="15" r="4" fill="#c084fc"/>
    <text x="27" y="19" fill="#e9d5ff" font-size="11" font-weight="600" letter-spacing="0.5">Teleoperation</text>
  </g>

  <g class="float-1" transform="translate(820, 195)">
    <rect width="135" height="30" rx="15" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="15" cy="15" r="4" fill="#38bdf8"/>
    <text x="27" y="19" fill="#bae6fd" font-size="11" font-weight="600" letter-spacing="0.5">Edge Deployment</text>
  </g>

  <!-- Real-time Animated Waveform along the bottom -->
  <path d="M 0 315 Q 120 295 240 315 T 480 315 T 720 315 T 1000 315" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" class="telemetry-line"/>

  <!-- 4. FOREGROUND CONTAINER (High Contrast & Guaranteed Unobstructed) -->
  <!-- Translucent Backdrop Halo to ensure 100% crisp contrast for foreground typography -->
  <rect x="200" y="35" width="600" height="245" rx="20" fill="#070a14" fill-opacity="0.82" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25"/>

  <!-- Top Pill Badge: LIVE DIRECTORY -->
  <g transform="translate(390, 52)">
    <rect width="220" height="26" rx="13" fill="#0f172a" stroke="#22c55e" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="16" cy="13" r="4.5" fill="#22c55e" filter="url(#softGlow)"/>
    <circle cx="16" cy="13" r="8" fill="none" stroke="#22c55e" stroke-width="1" class="ping-ring"/>
    <text x="28" y="17" fill="#86efac" font-size="10.5" font-weight="700" letter-spacing="1">CURATED ROBOPS ECOSYSTEM</text>
  </g>

  <!-- Robot Icon Glyph -->
  <g transform="translate(480, 88)">
    <rect x="0" y="0" width="40" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Eyes -->
    <circle cx="13" cy="16" r="3.5" fill="#38bdf8" filter="url(#softGlow)"/>
    <circle cx="27" cy="16" r="3.5" fill="#38bdf8" filter="url(#softGlow)"/>
    <!-- Antenna -->
    <line x1="20" y1="0" x2="20" y2="-7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="20" cy="-8" r="2.5" fill="#818cf8"/>
    <!-- Mouth / Grid -->
    <line x1="12" y1="26" x2="28" y2="26" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Main Title -->
  <text x="500" y="170" text-anchor="middle" fill="url(#titleGrad)" font-size="36" font-weight="900" letter-spacing="1.5">
    AWESOME ROBOTICS DEVOPS
  </text>

  <!-- Subtitle -->
  <text x="500" y="204" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="600" letter-spacing="0.4">
    Fleet Observability • Incident Management • Edge CI/CD • Teleoperation
  </text>

  <!-- Description / Meta Line -->
  <text x="500" y="235" text-anchor="middle" fill="#94a3b8" font-size="12.5" font-weight="400" letter-spacing="0.2">
    The definitive guide to enterprise SaaS platforms and open-source tools for physical AI &amp; robot fleets
  </text>

  <!-- Bottom Accent Line -->
  <line x1="380" y1="256" x2="620" y2="256" stroke="url(#titleGrad)" stroke-width="2" stroke-linecap="round"/>
</svg>
